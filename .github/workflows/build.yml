name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
      - name: Prepare signing key
        env:
          HIMA_KEYSTORE_B64: ${{ secrets.HIMA_KEYSTORE_B64 }}
        run: echo "$HIMA_KEYSTORE_B64" | base64 -d > app/hima.keystore
      - name: Build debug APK
        env:
          HIMA_KEYSTORE_PASS: ${{ secrets.HIMA_KEYSTORE_PASS }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hima-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
